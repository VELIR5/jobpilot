name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate mini-program files
        run: npm run check:miniapp

      - name: Test Linux deployment controller
        run: python3 -m unittest discover -s scripts/linux -p 'test_*.py' -v

      - name: Initialize isolated build database
        env:
          JOBPILOT_DATA_DIR: ${{ runner.temp }}/jobpilot-ci-data
        run: npm run db:push

      - name: Build production application
        env:
          JOBPILOT_DATA_DIR: ${{ runner.temp }}/jobpilot-ci-data
        run: npm run build
