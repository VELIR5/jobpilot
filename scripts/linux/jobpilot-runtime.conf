# Install as /etc/systemd/system/jobpilot.service.d/releases.conf only at activation.
# Preserve the existing ExecStart, port, restart policy, user, and original unit.
[Service]
WorkingDirectory=/opt/jobpilot-deploy/current
EnvironmentFile=/opt/jobpilot/.env
EnvironmentFile=-/opt/jobpilot-deploy/current/.release.env
Environment=JOBPILOT_DATA_DIR=/opt/jobpilot/data/JobPilot
Environment=JOBPILOT_UPLOAD_DIR=/opt/jobpilot/data/uploads
